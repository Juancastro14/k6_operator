# Long-lived service-account token. Kubernetes lo populariza automaticamente
# con la JWT del SA cuando se aplica este Secret. Usado por el CI de
# perfomanceTestingK6 (workflow run-test.yml) via el GH secret KUBECONFIG_DATA.
apiVersion: v1
kind: Secret
metadata:
  name: k6-test-runner-token
  namespace: compute-resources-area-calidad-dev
  annotations:
    kubernetes.io/service-account.name: k6-test-runner
type: kubernetes.io/service-account-token
